[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tandem-backend"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["fastapi==0.115.12", "httpx==0.28.1", "uvicorn==0.34.2"]

[project.optional-dependencies]
dev = ["ruff==0.11.8", "build==1.2.2.post1", "websockets==15.0.1"]

[tool.setuptools]
py-modules = ["app", "api_models", "recommendations"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
