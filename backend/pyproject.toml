[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tandem-backend"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["fastapi==0.115.12", "httpx==0.28.1", "uvicorn==0.34.2", "numpy>=1.26,<2", "torch>=2", "python-multipart>=0.0.12", "openai>=1.50", "sentence-transformers>=3", "google-auth>=2.30", "requests>=2.31"]

[project.optional-dependencies]
dev = ["ruff==0.11.8", "build==1.2.2.post1", "websockets==15.0.1", "pytest>=8"]

[tool.setuptools]
py-modules = ["app", "api_models", "import_tmdb", "session_recommendations", "sqlite_session_store", "sqlite_sessions", "unified"]
packages = ["tandem"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools.package-data]
tandem = ["session_schema.sql"]
