<!doctype html>
<html lang="en" data-theme="velvet">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Filmocracy demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=DM+Sans:opsz,wght@9..40,400..700&family=Fraunces:opsz,wght@9..144,500..800&family=Unbounded:wght@500..800&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem('tandem-theme') || 'velvet';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>The Filmocracy demo needs JavaScript.</noscript>

    <!-- No build step: React from a CDN, JSX compiled in the browser by Babel. -->
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
    <script src="data.js"></script>
    <script type="text/babel" data-presets="react" src="engine.jsx"></script>
    <script type="text/babel" data-presets="react" src="shared.jsx"></script>
    <script type="text/babel" data-presets="react" src="tv.jsx"></script>
    <script type="text/babel" data-presets="react" src="phone.jsx"></script>
    <script type="text/babel" data-presets="react" src="app.jsx"></script>
  </body>
</html>
